# Entorno TESTING efímero — Podman rootless + podman-compose (BORRADOR, T-12).
#
# Requisitos de docs/testing.md §7.1. Todavía no se puede levantar: faltan la
# imagen final de la app (deploy/app/Containerfile, cuando exista el código) y
# las imágenes de los ejecutores (las construye Testing desde tests/).
#
# Lo orquesta tests/run.sh (Testing). Secuencia (docs/infraestructura.md §9):
#   P="podman-compose -f compose.test.yaml -p <proyecto>"
#   $P --profile <suite> up -d db                    # (si la suite usa BD)
#   podman wait --condition=healthy <proyecto>_db_1
#   $P --profile setup run --rm --no-deps migrate    # código de salida real
#   $P --profile setup run --rm --no-deps migrate-template   # solo integration (T-28)
#   $P --profile <suite> up --abort-on-container-exit --exit-code-from runner-<suite>
#   $P --profile <suite> --profile setup down -v     # siempre (trap)
#
# Variables obligatorias (las fija tests/run.sh; imágenes SIEMPRE por digest):
#   APP_IMAGE            imagen de la app aprobada (la misma irá a DEMO)
#   TESTS_NODE_IMAGE     ejecutor Vitest/arnés (Testing)
#   PLAYWRIGHT_IMAGE     mcr.microsoft.com/playwright@sha256:... (versión = lockfile)
#   K6_IMAGE             docker.io/grafana/k6@sha256:...
#   TOXIPROXY_IMAGE      ghcr.io/shopify/toxiproxy@sha256:...
#   ZAP_IMAGE            docker.io/zaproxy/zap-stable@sha256:...
#   TEST_SECRETS_DIR     directorio 0700 con secretos aleatorios de ESTA ejecución
#                        (p. ej. $XDG_RUNTIME_DIR/mi-app-test-<id>), borrado al final.
#                        Ficheros: db_superuser_password, db_owner_password,
#                        db_app_password, db_backup_password, pin_pepper y
#                        db_test_admin_password (T-28; solo existe en TESTING).
# Opcionales: APP_TZ (por defecto UTC), TEST_RESULTS_DIR (./tests/results),
#   TEST_PROXY_APP_SUBNET (10.89.240.0/29), TEST_PROXY_IP (10.89.240.2) y
#   TEST_APP_IP (10.89.240.3): cambiar en ejecuciones en paralelo. Las dos IP
#   deben ser distintas y estar dentro de la subred (SEC-028).

x-podman:
  in_pod: false

x-hardening: &hardening
  user: "1000:1000"
  userns_mode: "keep-id:uid=1000,gid=1000"
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=256m
  ipc: private
  logging:
    driver: k8s-file
    options:
      max-size: 20mb

x-app-env: &app-env
  NODE_ENV: production
  TZ: ${APP_TZ:-UTC}
  LOG_LEVEL: info
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_NAME: cafeteria
  # Configuración no secreta de config.ts (docs/arquitectura.md §10.1). En el
  # ancla común porque parseSettings la valida también en migrate.
  # Origen que usan los navegadores de Playwright (BASE_URL, a través de Toxiproxy).
  PUBLIC_ORIGIN: https://toxiproxy:8443
  # Solo la IP fija de proxy en la red proxy-app (RS-06, SEC-003).
  TRUSTED_PROXIES: ${TEST_PROXY_IP:-10.89.240.2}
  METRICS_PORT: "9464"
  SESSION_MAX_HOURS: "12"

x-runner: &runner
  <<: *hardening
  # SEC-018: .secrets/ del repositorio tapado por un tmpfs vacío, ro y 0000.
  # "notmpcopyup" es OBLIGATORIO (sin él Podman copiaría los secretos de debajo
  # al tmpfs); por eso va aquí y no en la sintaxis larga de volumes.
  # Requiere que exista .secrets/ en el checkout: tests/run.sh hace antes
  # `mkdir -p -m 0700 .secrets` (en CI no existe; si falta, el contenedor no arranca).
  # Los secretos de la ejecución llegan solo por /run/secrets (TEST_SECRETS_DIR).
  # .git y .claude ya son de solo lectura: todo el repositorio se monta en ro.
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=256m
    - /workspace/.secrets:ro,nosuid,nodev,noexec,size=4k,mode=0000,notmpcopyup
  # Código del repositorio en solo lectura; solo los directorios de salida
  # se montan en escritura.
  volumes:
    - ./:/workspace:ro
    - ${TEST_RESULTS_DIR:-./tests/results}:/workspace/tests/results:rw
    - ./tests/screenshots:/workspace/tests/screenshots:rw
    - caddy-data:/caddy-data:ro
  working_dir: /workspace
  environment: &runner-env
    TZ: UTC
    HOME: /tmp
    # CA interna de ESTA ejecución: se confía en ella, no se ignoran errores TLS.
    NODE_EXTRA_CA_CERTS: /caddy-data/caddy/pki/authorities/local/root.crt
    BASE_URL: https://toxiproxy:8443
    DIRECT_URL: https://proxy:8443
  healthcheck:
    disable: true
  restart: "no"

services:

  db:
    <<: *hardening
    profiles: [integration, e2e, perf, security]
    image: docker.io/library/postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    command:
      - postgres
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=off
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d "
      - -c
      - log_min_duration_statement=200ms
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_statement=none
      - -c
      - log_error_verbosity=terse
      - -c
      - log_lock_waits=on
      - -c
      - log_connections=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      # Datos efímeros: no hace falta durabilidad en disco.
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
      - /run/postgresql:rw,nosuid,nodev,noexec,size=1m,mode=0700,U
      # Datos en tmpfs: nada persiste entre ejecuciones (§7.1).
      - /var/lib/postgresql:rw,nosuid,nodev,size=512m,mode=0700,U
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8"
      APP_DB_NAME: cafeteria
      TZ: UTC
      # Activa 20-test-admin.sh (rol CREATEDB + plantilla). Solo en este fichero.
      MI_APP_ENTORNO: testing
      APP_TEMPLATE_DB: app_template
    secrets: [db_superuser_password, db_owner_password, db_app_password, db_backup_password, db_test_admin_password]
    volumes:
      # Ficheros sueltos (no el directorio): el mismo 10-roles.sh de todos los
      # entornos y, solo en TESTING, 20-test-admin.sh (T-28, §9.1). Los puntos
      # de montaje se crean en la raíz de la imagen, no en el árbol del host.
      - ./deploy/db/initdb/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./deploy/db/testing/20-test-admin.sh:/docker-entrypoint-initdb.d/20-test-admin.sh:ro
    # backend: app, migrate, runner-integration. db-seed: solo db y runner-e2e
    # (T-29), para que el ejecutor e2e llegue a la BD pero no a app:3000.
    networks: [backend, db-seed]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-d", "cafeteria", "-U", "app_rw"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    stop_signal: SIGINT
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g, pids: 200 }

  migrate:
    <<: *hardening
    profiles: [setup]
    image: ${APP_IMAGE:?APP_IMAGE obligatorio (por digest)}
    command: ["node", "dist/migrate.js"]
    environment:
      <<: *app-env
      DATABASE_USER: app_owner
      DATABASE_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]
    networks: [backend]
    healthcheck:
      disable: true
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256m, pids: 100 }

  # Las mismas migraciones sobre la BD plantilla de integración (T-28, §9.2 de
  # docs/testing.md). Misma imagen, mismo rol (app_owner); solo cambia la BD.
  migrate-template:
    <<: *hardening
    profiles: [setup]
    image: ${APP_IMAGE:?APP_IMAGE obligatorio (por digest)}
    command: ["node", "dist/migrate.js"]
    environment:
      <<: *app-env
      DATABASE_NAME: app_template
      DATABASE_USER: app_owner
      DATABASE_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]
    networks: [backend]
    healthcheck:
      disable: true
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256m, pids: 100 }

  app:
    <<: *hardening
    profiles: [integration, e2e, perf, security]
    image: ${APP_IMAGE:?APP_IMAGE obligatorio (por digest)}
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: "3000"
      # Configuración de instalación (no secreta, arquitectura §4.1).
      TABLE_COUNT: "20"
      DELAY_THRESHOLD_MINUTES: "10"
      DATABASE_USER: app_rw
      DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
      PIN_PEPPER_FILE: /run/secrets/pin_pepper
    secrets: [db_app_password, pin_pepper]
    # backend: db. proxy-app: solo recibe de proxy (único origen de confianza).
    # IP fija también para app (SEC-028): app arranca antes que proxy y, sin
    # ella, Podman le daría la primera libre (.2), la reservada para proxy, y
    # proxy fallaría con "IPAM error: ... already allocated".
    networks:
      backend: {}
      proxy-app:
        ipv4_address: ${TEST_APP_IP:-10.89.240.3}
    depends_on:
      db: { condition: service_healthy }
    # HEALTHCHECK de la imagen (node dist/healthcheck.js), docs/logging.md §8.1.
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m, pids: 200 }

  proxy:
    <<: *hardening
    profiles: [e2e, perf, security]
    image: docker.io/library/caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    environment:
      SITE_ADDRESS: "proxy, toxiproxy"
      CADDY_TLS: internal
      PUBLIC_HTTPS_SUFFIX: ":8443"
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
      - /config:rw,nosuid,nodev,noexec,size=4m,mode=0700,U
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # CA interna generada en esta ejecución; los ejecutores la montan en ro.
      - caddy-data:/data
    # proxy ya no está en backend: solo ve a app (proxy-app) y a los clientes (edge).
    networks:
      proxy-app:
        ipv4_address: ${TEST_PROXY_IP:-10.89.240.2}
      edge: {}
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9180/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m, pids: 100 }

  toxiproxy:
    <<: *hardening
    profiles: [e2e, perf]
    image: ${TOXIPROXY_IMAGE:?TOXIPROXY_IMAGE obligatorio (por digest)}
    # Proxy TCP toxiproxy:8443 -> proxy:8443 (lo configura tests/support/ por la API :8474).
    command: ["-host", "0.0.0.0"]
    networks: [edge]
    depends_on:
      proxy: { condition: service_healthy }
    healthcheck:
      disable: true
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64m, pids: 50 }

  # ---------------- Ejecutores (uno por suite; --exit-code-from) ----------------

  runner-unit:
    <<: *runner
    profiles: [unit]
    image: ${TESTS_NODE_IMAGE:?TESTS_NODE_IMAGE obligatorio (por digest)}
    command: ["pnpm", "run", "test:unit"]
    network_mode: none
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g, pids: 512 }

  runner-integration:
    <<: *runner
    profiles: [integration]
    image: ${TESTS_NODE_IMAGE:?TESTS_NODE_IMAGE obligatorio (por digest)}
    command: ["pnpm", "run", "test:integration"]
    environment:
      TZ: UTC
      HOME: /tmp
      API_URL: http://app:3000
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: cafeteria
      # T-28 (a): la app en proceso (buildApp) y los constructores de datos usan
      # el rol real de la app. Ya no recibe app_owner (DDL): mínimo privilegio.
      DATABASE_APP_USER: app_rw
      DATABASE_APP_PASSWORD_FILE: /run/secrets/db_app_password
      # T-28 (b): rol SOLO de TESTING con CREATEDB, solo en este ejecutor, para
      # CREATE DATABASE t_<x> TEMPLATE app_template / DROP DATABASE (RS-09).
      DATABASE_ADMIN_USER: test_admin
      DATABASE_ADMIN_PASSWORD_FILE: /run/secrets/db_test_admin_password
      DATABASE_TEMPLATE: app_template
    # Sin pin_pepper: la integración usa un pepper propio en proceso (tests/support/app.ts).
    secrets: [db_app_password, db_test_admin_password]
    networks: [backend]
    depends_on:
      app: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g, pids: 512 }

  runner-security:
    <<: *runner
    profiles: [security]
    image: ${TESTS_NODE_IMAGE:?TESTS_NODE_IMAGE obligatorio (por digest)}
    command: ["pnpm", "run", "test:security"]
    networks: [edge]
    depends_on:
      proxy: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g, pids: 512 }

  zap:
    <<: *runner
    profiles: [security]
    image: ${ZAP_IMAGE:?ZAP_IMAGE obligatorio (por digest)}
    command: ["zap-baseline.py", "-t", "https://proxy:8443", "-J", "/workspace/tests/results/zap.json"]
    networks: [edge]
    depends_on:
      proxy: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 2g, pids: 512 }

  runner-e2e:
    <<: *runner
    profiles: [e2e]
    image: ${PLAYWRIGHT_IMAGE:?PLAYWRIGHT_IMAGE obligatorio (por digest)}
    # T-34: antes del comando, almacén de CA del sistema = el de la imagen + la
    # CA de ESTA ejecución, en un tmpfs del contenedor efímero (WebKit/GnuTLS
    # lee /etc/ssl/certs/ca-certificates.crt; nunca ignoreHTTPSErrors). No
    # toca el host ni la imagen. Chromium sigue con la fijación SPKI.
    # Si algo falla, avisa y sigue: solo fallaría el proyecto WebKit.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        CA=/caddy-data/caddy/pki/authorities/local/root.crt
        B=/etc/ssl/certs/ca-certificates.crt
        if [ -s "$$CA" ] && [ -f "$$B" ] \
           && cat "$$B" "$$CA" > /etc/ssl/certs/.bundle.tmp \
           && mv -f /etc/ssl/certs/.bundle.tmp "$$B"; then
          echo "runner-e2e: CA de la ejecución añadida al almacén del contenedor (T-34)"
        else
          echo "runner-e2e: AVISO: no se pudo añadir la CA al almacén; WebKit no confiará en el proxy (T-34)" >&2
        fi
        exec "$$@"
      - runner-e2e
    command: ["npx", "playwright", "test"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
      - /workspace/.secrets:ro,nosuid,nodev,noexec,size=4k,mode=0000,notmpcopyup
      # Copia del contenido de la imagen (copy-up por defecto) en un tmpfs del
      # usuario del contenedor (U); se pierde al terminar.
      - /etc/ssl/certs:rw,nosuid,nodev,noexec,size=8m,U
    environment:
      <<: *runner-env
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      TOXIPROXY_API: http://toxiproxy:8474
      # T-29: siembra de usuarios (hasta HU-07) y estado fabricado en BD (§8.1)
      # con el rol de la app; solo por la red db-seed (no llega a app:3000).
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: cafeteria
      DATABASE_APP_USER: app_rw
      DATABASE_APP_PASSWORD_FILE: /run/secrets/db_app_password
      # Pepper ALEATORIO de esta ejecución (el mismo que app). Nunca fuera de TESTING.
      PIN_PEPPER_FILE: /run/secrets/pin_pepper
    secrets: [db_app_password, pin_pepper]
    # Memoria compartida para Chromium sin --ipc=host (§7.2).
    shm_size: 1g
    networks: [edge, db-seed]
    depends_on:
      proxy: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3g, pids: 1024 }

  runner-perf:
    <<: *runner
    profiles: [perf]
    image: ${K6_IMAGE:?K6_IMAGE obligatorio (por digest)}
    command: ["run", "/workspace/tests/performance/k6/main.js"]
    networks: [edge]
    depends_on:
      proxy: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g, pids: 512 }

networks:
  # Ambas internas: la ejecución de tests no tiene salida a internet.
  backend:
    internal: true
  edge:
    internal: true
  # Solo db y runner-e2e (T-29).
  db-seed:
    internal: true
  # Solo proxy y app, los dos con IP fija (SEC-028). Subred fija para que proxy
  # tenga una IP conocida (TRUSTED_PROXIES). Dos ejecuciones EN PARALELO
  # necesitan valores distintos de TEST_PROXY_APP_SUBNET, TEST_PROXY_IP y
  # TEST_APP_IP (si no, Podman rechaza la red).
  proxy-app:
    internal: true
    ipam:
      config:
        - subnet: ${TEST_PROXY_APP_SUBNET:-10.89.240.0/29}

volumes:
  caddy-data: {}

secrets:
  db_superuser_password: { file: "${TEST_SECRETS_DIR:?TEST_SECRETS_DIR obligatorio}/db_superuser_password" }
  db_owner_password:     { file: "${TEST_SECRETS_DIR:?TEST_SECRETS_DIR obligatorio}/db_owner_password" }
  db_app_password:       { file: "${TEST_SECRETS_DIR:?TEST_SECRETS_DIR obligatorio}/db_app_password" }
  db_backup_password:    { file: "${TEST_SECRETS_DIR:?TEST_SECRETS_DIR obligatorio}/db_backup_password" }
  pin_pepper:            { file: "${TEST_SECRETS_DIR:?TEST_SECRETS_DIR obligatorio}/pin_pepper" }
  # T-28: solo TESTING; lo reciben db (init) y runner-integration.
  db_test_admin_password: { file: "${TEST_SECRETS_DIR:?TEST_SECRETS_DIR obligatorio}/db_test_admin_password" }
