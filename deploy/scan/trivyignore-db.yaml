# PROPUESTA de excepcion (SEC-049), PENDIENTE de validacion de Cybersecurity.
# Solo el binario /usr/local/bin/gosu de la imagen postgres (Go 1.24.6, stdlib):
# 1 critica y 25 altas, todas con correccion en Go pero no en la imagen
# oficial. gosu solo lo usa docker-entrypoint.sh si el contenedor arranca como
# root; los `db` de todos los entornos corren con user 1000:1000, cap_drop ALL y
# no-new-privileges, y no llaman a gosu (comprobado por tests/run.sh containers).
# Alcance: solo la ruta usr/local/bin/gosu y solo pkg:golang/stdlib@v1.24.6;
# otro binario u otra version vuelve a fallar. Revision a los 30 dias.
# La alternativa sin excepcion es una imagen derivada sin gosu (docs/infraestructura.md §8.2).
vulnerabilities:
  - id: CVE-2025-68121
    paths: ["usr/local/bin/gosu"]
    purls: ["pkg:golang/stdlib@v1.24.6"]
    expired_at: 2026-12-26
    statement: "SEC-049 (propuesta): gosu no se ejecuta, db sin root (docs/seguridad.md SEC-049)"
