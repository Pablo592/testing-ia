# EXC-02 (SEC-049): APROBADA por Cybersecurity el 2026-11-26 (docs/seguridad.md
# §6.10 y SEC-049), pendiente de ratificacion humana en la puerta de la Etapa 2.
# Solo el binario /usr/local/bin/gosu de la imagen postgres (gosu 1.20, Go 1.24.6,
# stdlib): 1 critica y 25 altas, todas en paquetes que gosu NO enlaza
# (crypto/tls, crypto/x509, net, net/http, net/url, net/mail, mime, encoding/xml,
# encoding/asn1, html/template, x/net/idna, os.Root: 0 simbolos, comprobado con
# nm). gosu solo lo usa docker-entrypoint.sh si arranca como root; los db de
# todos los entornos corren con user 1000:1000, cap_drop ALL y no-new-privileges
# (TX-CONT-01) y ningun compose llama a gosu (lo comprueba construir.sh).
# Alcance: solo estos 26 CVE, solo la ruta usr/local/bin/gosu y solo
# pkg:golang/stdlib@v1.24.6; otro CVE, binario o version vuelve a fallar.
# Caduca 2026-12-26 y NO se prorroga: antes de esa fecha (y antes de DEMO) la
# imagen de db pasa a ser una derivada sin gosu (docs/seguridad.md SEC-049).
# Al cambiar el digest de db se repite la comprobacion con nm (docs/seguridad.md
# §6.10 punto 4); si gosu enlaza un paquete afectado, esa entrada decae.
# NO cubre nada del sistema operativo de la imagen (libxml2: SEC-049, SEC-051).
vulnerabilities:
  - id: CVE-2025-68121
    paths: ["usr/local/bin/gosu"]
    purls: ["pkg:golang/stdlib@v1.24.6"]
    expired_at: 2026-12-26
    statement: "SEC-049 / EXC-02: gosu no enlaza los paquetes afectados y no se ejecuta (docs/seguridad.md §6.10)"
